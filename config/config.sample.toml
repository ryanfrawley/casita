# Copy to config/config.toml. The server rewrites that file when config is set through the API,
# so comments in it are not preserved.

[server]
port = 8123
# Admin credential that works only until the first user is created (16+ characters).
# apiToken = "change-me-change-me"
# timezone = "America/Los_Angeles"
# Units readings are shown in: "metric" (default) or "imperial". Stored values are not changed.
# units = "imperial"
# The web app is served from this port once built (`bun run web:build`). To serve only the API:
# web = false

[server.history]
defaultDays = 30          # raw retention when nothing more specific applies
minIntervalMs = 0         # skip raw sensor writes closer than this

# [server.history.domains.lock]
# raw = 90

[[integration]]
type = "demo"

